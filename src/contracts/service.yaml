openapi: 3.0.2
info:
  title: Example API
  description: This is a sample API to demonstrate OpenAPI specification.
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server
  - url: http://localhost

tags:
  - name: Users
  - name: Ops
    description: User management operations

paths:
  /users:
    get:
      tags:
        - Users
      summary: Get all users
      operationId: getUsers
      description: Retrieve a cursor-paginated list of users.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of users to return
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: >-
            Opaque cursor returned as nextCursor by the previous page; omit to
            start from the first page
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Invalid pagination parameters or malformed cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Accept a user creation (asynchronous)
      operationId: createUser
      description: >-
        Publishes a USER.NEW message carrying the request's correlation id
        (cid) and trace context; the consumer persists the user
        asynchronously. The operation is idempotent by user id: resubmitting
        the same id is deduplicated at the FIFO queue and, beyond that, is a
        storage-level no-op — exactly one user is ever created. Duplicate
        emails are resolved at consume time (an email uniqueness guard
        rejects the second user), so this endpoint never returns 409. Track
        the request with the returned cid via GET /ops/users.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '202':
          description: User creation accepted and published to the queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreationAccepted'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get a user by ID
      operationId: getUserById
      description: Retrieve a user by their unique ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Update a user
      operationId: updateUser
      description: Update the information of an existing user by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      description: Delete an existing user by ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ops/user-new/redrive:
    post:
      tags:
        - Ops
      summary: Force a redrive of the USER.NEW dead-letter queue
      operationId: redriveUserNewDlq
      description: >-
        Starts a native SQS message move task from the USER.NEW DLQ back to
        its source queue. The move runs asynchronously on the queue side.
      responses:
        '202':
          description: Redrive task started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedriveAccepted'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ops/users:
    get:
      tags:
        - Ops
      summary: Find users by correlation id
      operationId: getUsersByCid
      description: >-
        Returns the users created under the given correlation id (the cid
        returned by POST /users and stamped on the item at write time).
      parameters:
        - name: cid
          in: query
          required: true
          schema:
            type: string
          description: The correlation id to search for
      responses:
        '200':
          description: Users created under the correlation id (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersByCid'
        '400':
          description: Missing or invalid cid parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the user
        name:
          type: string
          description: The user's name
        email:
          type: string
          format: email
          description: The user's email address
        createdAt:
          type: string
          format: date-time
          description: The date and time the user was created
    UserCreationAccepted:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation that the creation was accepted
          example: 'User creation accepted'
        cid:
          type: string
          description: >-
            Correlation id of the request — propagated in the message and
            stored on the created item; use it with GET /ops/users
    RedriveAccepted:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Confirmation that the redrive task was started
          example: 'DLQ redrive started'
        taskHandle:
          type: string
          description: Handle of the SQS message move task, when reported
    UsersByCid:
      type: object
      required:
        - cid
        - items
      properties:
        cid:
          type: string
          description: The correlation id that was searched
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The users created under the correlation id
    UserPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: The users in this page
        nextCursor:
          type: string
          description: >-
            Opaque cursor to fetch the next page; absent when this is the last
            page
    NewUser:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          description: The unique identifier for the user
        name:
          type: string
          description: The user's name
        email:
          type: string
          format: email
          description: The user's email address
        createdAt:
          type: string
          format: date-time
          description: The creation timestamp (optional)
    UpdateUser:
      type: object
      properties:
        name:
          type: string
          description: The user's name
        email:
          type: string
          format: email
          description: The user's email address
    Error:
      type: object
      required:
        - message
        - status
      properties:
        message:
          type: string
          description: Error message describing what went wrong
          example: 'User not found'
        status:
          type: integer
          description: HTTP status code
          example: 404
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/users/123'
    ValidationError:
      type: object
      required:
        - message
        - status
        - errors
      properties:
        message:
          type: string
          description: General validation error message
          example: 'Validation failed'
        status:
          type: integer
          description: HTTP status code
          example: 400
        timestamp:
          type: string
          format: date-time
          description: When the error occurred
          example: '2025-07-15T17:30:00.000Z'
        path:
          type: string
          description: The API endpoint that generated the error
          example: '/users'
        errors:
          type: array
          description: List of specific validation errors
          items:
            type: object
            properties:
              field:
                type: string
                description: The field that failed validation
                example: 'email'
              message:
                type: string
                description: The validation error message
                example: 'Email is required'
              value:
                type: string
                description: The invalid value provided
                example: ''
    SuccessMessage:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Success message
          example: 'User deleted successfully'
        timestamp:
          type: string
          format: date-time
          description: When the operation was completed
          example: '2025-07-15T17:30:00.000Z'
